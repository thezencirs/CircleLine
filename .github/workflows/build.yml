name: Build & Release CircleLine

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build CircleLine
        shell: pwsh
        run: .\build.ps1
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleLine-dist
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/CircleLine-*-win.zip
            dist/CircleLine.exe
            dist/SHA256SUMS.txt
